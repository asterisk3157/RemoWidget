<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8fd9"/>
      <stop offset="1" stop-color="#1c4f8a"/>
    </linearGradient>
  </defs>

  <!-- macOS 風の角丸 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- 室温表示をモチーフにした数字 -->
  <text x="512" y="470" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif"
        font-size="300" font-weight="300" fill="#fff" text-anchor="middle"
        letter-spacing="-12">22</text>
  <text x="512" y="470" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif"
        font-size="300" font-weight="300" fill="#fff" text-anchor="middle"
        letter-spacing="-12" opacity="0"> </text>

  <!-- 雪の結晶（冷房）: 6 方向 -->
  <g transform="translate(300 680)" stroke="#fff" stroke-width="22" stroke-linecap="round" fill="none" opacity=".95">
    <path d="M0 -95 V95 M-82 -47 L82 47 M-82 47 L82 -47"/>
    <path d="M-26 -70 L0 -46 L26 -70 M-26 70 L0 46 L26 70"/>
  </g>

  <!-- 電球（照明） -->
  <g transform="translate(724 672)" stroke="#fff" stroke-width="22" stroke-linecap="round"
     stroke-linejoin="round" fill="none" opacity=".95">
    <path d="M-52 34 a66 66 0 1 1 104 0 c-11 9 -16 21 -17 34 h-70 c-1 -13 -6 -25 -17 -34z"/>
    <path d="M-32 106 h64"/>
  </g>
</svg>
